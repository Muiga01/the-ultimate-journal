<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — The Ultimate Journal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dark">
  <div class="flex min-h-screen w-full items-center justify-center bg-background px-4">
    <div class="w-full max-w-md rounded-xl border border-card-border bg-card text-foreground shadow-lg p-8">
      <div class="flex flex-col items-center space-y-4 mb-6">
        <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-primary text-primary-foreground">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <h1 class="text-xl font-bold tracking-tight">The Ledger</h1>
        <p class="text-sm text-muted-foreground">NovaPay Shared Trading Journal</p>
      </div>

      <div class="space-y-3">
        <button id="btn-google" class="btn btn-default w-full justify-center">
          <svg class="h-4 w-4 mr-2" fill="currentColor" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12.06c0 1.84.43 3.51 1.18 4.93l3.66-2.9z" />
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.57 2.77c.87-2.6 3.3-4.53 6.25-4.53z" />
          </svg>
          Continue with Google
        </button>
      </div>

      <div class="relative mt-6">
        <div class="absolute inset-0 flex items-center">
          <span class="w-full border-t border-border" />
        </div>
        <div class="relative flex justify-center text-xs uppercase">
          <span class="bg-card px-2 text-muted-foreground">Or sign in with name</span>
        </div>
      </div>

      <form id="signin-form" class="mt-4 space-y-3">
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <input
            id="signin-name"
            type="text"
            placeholder="Trader name"
            class="input pl-9"
            value=""
          />
        </div>
        <p id="signin-error" class="text-sm text-destructive hidden"></p>
        <button type="submit" class="btn btn-default w-full">Enter Journal</button>
      </form>

      <div class="mt-6 flex items-center justify-between text-xs text-muted-foreground">
        <button id="btn-theme" class="hover:underline">
          Switch to <span id="theme-text">Light</span> mode
        </button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Sign-in page specific logic
    document.addEventListener("DOMContentLoaded", () => {
      Theme.init();

      const themeBtn = document.getElementById("btn-theme");
      const themeText = document.getElementById("theme-text");

      function updateThemeText() {
        themeText.textContent = Theme.getResolved() === "dark" ? "Light" : "Dark";
      }
      updateThemeText();

      themeBtn.addEventListener("click", () => {
        Theme.toggle();
        updateThemeText();
      });

      document.getElementById("signin-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("signin-name").value.trim();
        const errorEl = document.getElementById("signin-error");
        if (!name) {
          errorEl.textContent = "Enter a name";
          errorEl.classList.remove("hidden");
          return;
        }
        errorEl.classList.add("hidden");
        sessionStorage.setItem("journal_name", name.trim());
        window.location.href = "dashboard.html";
      });

      document.getElementById("btn-google").addEventListener("click", () => {
        // Demo fallback: use anonymous name-based entry
        const name = "Google User";
        sessionStorage.setItem("journal_name", name);
        window.location.href = "dashboard.html";
      });
    });
  </script>
</body>
</html>
